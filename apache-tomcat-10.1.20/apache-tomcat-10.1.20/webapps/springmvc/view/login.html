<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="/springmvc/css/bootstrap.min.css">
    <script type="text/javascript" src="/springmvc/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container py-5">
    <form class="col-md-4 offset-md-4" method="" action="">
        <p class="display-6 text-center mb-5">Login</p>
        <!--基础输入表单组-->
        <div class="row mb-3">
            <label class="col-sm-2 col-form-label" for="a">账号</label>
            <div class="col-sm-10">
                <input type="text" class="form-control" id="a">
            </div>
        </div>
        <div class="row mb-3">
            <label class="col-sm-2 col-form-label" for="b">密码</label>
            <div class="col-sm-10">
                <input type="password" class="form-control" id="b">
            </div>
        </div>
        <div class="row mb-3">
            <label class="col-sm-2 col-form-label" for="c">验证码</label>
            <div class="col-sm-10">
                <div class="input-group">
                    <input type="text" class="form-control" id="c">
                    <img src="/springmvc/captcha" height="37.6">
                </div>
            </div>
        </div>
        <button class="btn btn-primary w-100 rounded-0">提 交</button>
    </form>
</div>

</body>
</html>
